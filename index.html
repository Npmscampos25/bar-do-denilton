<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar do Denilton</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        
        .header { background: linear-gradient(135deg, #d4a574 0%, #8b6f47 100%); color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 24px; margin-bottom: 10px; }
        .header-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .header-btn { background: rgba(255,255,255,0.2); border: 2px solid white; color: white; padding: 8px 16px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .header-btn:hover { background: rgba(255,255,255,0.3); }
        .header-btn.active { background: white; color: #8b6f47; }
        
        .tab-content { display: none; padding: 20px; min-height: 100vh; }
        .tab-content.active { display: block; }
        
        .section { background: white; padding: 20px; margin: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        input, button, select { padding: 12px; margin: 5px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; font-family: Arial, sans-serif; }
        input { width: 100%; }
        input:focus, button:focus, select:focus { outline: none; border-color: #d4a574; box-shadow: 0 0 5px rgba(212, 165, 116, 0.3); }
        
        button { cursor: pointer; background: #d4a574; color: white; border: none; width: 100%; font-weight: bold; transition: all 0.3s; }
        button:hover { background: #8b6f47; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212, 165, 116, 0.3); }
        
        .categories { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 15px 0; }
        .categories button { padding: 12px; border: 2px solid #ddd; background: white; color: #333; font-weight: bold; border-radius: 8px; margin: 0; }
        .categories button:hover { border-color: #d4a574; background: #f9f5f0; }
        .categories button.active { background: #d4a574; color: white; border-color: #d4a574; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 15px 0; }
        .product-btn { padding: 15px 10px; border: 2px solid #ddd; background: white; color: #333; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; margin: 0; }
        .product-btn:hover { border-color: #d4a574; background: #f9f5f0; color: #333; }
        .product-btn.active { background: #d4a574; color: white; border-color: #d4a574; }
        .product-name { font-size: 14px; font-weight: bold; }
        .product-price { color: #d4a574; font-weight: bold; font-size: 16px; }
        .product-btn.active .product-price { color: white; }
        
        .qty-section { display: flex; gap: 10px; margin-top: 20px; align-items: center; }
        .qty-input { flex: 0 0 80px; margin: 0; text-align: center; }
        .qty-section button { flex: 1; margin: 0; }
        
        .order { background: #fff9f5; border: 3px solid #d4a574; border-radius: 10px; padding: 20px; margin-top: 20px; display: none; }
        .order.show { display: block; animation: slideIn 0.3s ease-in-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .order h3 { color: #8b6f47; margin-bottom: 15px; font-size: 18px; }
        
        .order-item { padding: 10px 0; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .order-item:last-child { border-bottom: none; }
        .order-total { font-weight: bold; font-size: 20px; padding: 15px 0; border-top: 2px solid #d4a574; color: #d4a574; text-align: right; margin-top: 10px; }
        
        .btn-submit { background: #27ae60 !important; width: 100%; margin-top: 15px !important; }
        .btn-submit:hover { background: #229954 !important; }
        
        .msg { padding: 15px; margin: 10px 0; border-radius: 8px; display: none; animation: fadeIn 0.3s ease-in-out; }
        .msg.show { display: block; }
        .msg.success { background: #27ae60; color: white; }
        .msg.error { background: #ff6b6b; color: white; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .admin-table th, .admin-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .admin-table th { background: #d4a574; color: white; font-weight: bold; }
        .admin-table input { width: 100%; margin: 0; }
        .btn-add { background: #27ae60 !important; margin-top: 10px; }
        .btn-remove { background: #ff6b6b !important; width: 100%; margin: 0; padding: 8px; }
        
        .caixa-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .caixa-table th, .caixa-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .caixa-table th { background: #27ae60; color: white; font-weight: bold; }
        .caixa-table tr:nth-child(even) { background: #f9f9f9; }
        
        .resumo-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .resumo-table th, .resumo-table td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        .resumo-table th { background: #4a90e2; color: white; font-weight: bold; }
        .resumo-table tr:nth-child(even) { background: #f0f7ff; }
        .resumo-table td:last-child { text-align: right; font-weight: bold; color: #d4a574; }
        
        .search-section { background: #fff9f5; border: 2px solid #d4a574; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .search-section label { display: block; font-weight: bold; margin-bottom: 8px; }
        
        .info-box { background: #f0f7ff; border-left: 4px solid #4a90e2; padding: 15px; margin: 15px 0; }
        .info-box h3 { color: #4a90e2; margin-bottom: 10px; }
        .info-box .value { font-size: 24px; font-weight: bold; color: #d4a574; }
        
        .btn-pagar { background: #27ae60 !important; margin-top: 10px; }
        .btn-pagar:hover { background: #229954 !important; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🍺 Bar do Denilton</h1>
        <div class="header-buttons">
            <button class="header-btn active" onclick="switchTab('garcom')">🍽️ Garçom</button>
            <button class="header-btn" onclick="switchTab('caixa')">💰 Caixa</button>
            <button class="header-btn" onclick="switchTab('admin')">⚙️ Admin</button>
        </div>
    </div>

    <div id="garcom" class="tab-content active">
        <div class="section">
            <div id="msg" class="msg"></div>
            
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 8px;">👤 Nome do cliente</label>
                <input type="text" id="clientName" placeholder="Digite o nome">
            </div>
            
            <div>
                <label style="display: block; font-weight: bold; margin: 15px 0 8px 0;">📂 Categoria</label>
                <div class="categories" id="categories"></div>
            </div>
            
            <div>
                <label style="display: block; font-weight: bold; margin: 15px 0 8px 0;">🍔 Produto</label>
                <div class="products-grid" id="products"></div>
            </div>
            
            <div class="qty-section">
                <label style="flex: 0 0 80px; font-weight: bold;">Qtd</label>
                <input type="number" id="qty" value="1" min="1" class="qty-input">
                <button onclick="addProduct()">➕ Adicionar</button>
            </div>
            
            <div class="order" id="order">
                <h3>📋 Comanda</h3>
                <div id="orderItems"></div>
                <div class="order-total">Total: R$ <span id="total">0.00</span></div>
                <button class="btn-submit" onclick="submitOrder()">✅ Finalizar Comanda</button>
            </div>
        </div>
    </div>

    <div id="caixa" class="tab-content">
        <div class="section">
            <h2>💰 Caixa</h2>
            
            <div class="search-section">
                <label>🔍 PESQUISAR CLIENTE:</label>
                <input type="text" id="searchClient" placeholder="Digite o nome do cliente" onkeyup="searchAndShowComanda()">
            </div>
            
            <div id="comandaDetail"></div>
            
            <h3 style="margin-top: 30px; color: #4a90e2;">📋 COMANDAS ABERTAS AGORA:</h3>
            <table class="resumo-table">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="resumoTable"></tbody>
            </table>
        </div>
    </div>

    <div id="admin" class="tab-content">
        <div class="section">
            <h2>⚙️ Administração do Cardápio</h2>
            <p style="margin: 10px 0;">Adicione, edite ou remova produtos abaixo:</p>
            
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="adminTable"></tbody>
            </table>
            
            <button class="btn-add" onclick="addNewProduct()">➕ Adicionar Novo Produto</button>
        </div>
    </div>

    <script>
        let cardapio = [
            { produto: 'Cerveja Brahma', categoria: 'Bebidas', preco: 9.00 },
            { produto: 'Coca-Cola', categoria: 'Bebidas', preco: 6.00 },
            { produto: 'X-Salada', categoria: 'Lanches', preco: 27.00 },
            { produto: 'X-Bacon', categoria: 'Lanches', preco: 32.00 },
            { produto: 'Porção Frita', categoria: 'Porções', preco: 45.00 },
            { produto: 'Cerveja Heineken', categoria: 'Bebidas', preco: 12.00 },
            { produto: 'Cerveja Itaipava', categoria: 'Bebidas', preco: 8.00 },
            { produto: 'X-Tudo', categoria: 'Lanches', preco: 35.00 },
            { produto: 'X-Frango', categoria: 'Lanches', preco: 25.00 },
            { produto: 'X-Calabresa', categoria: 'Lanches', preco: 28.00 },
            { produto: 'Hambúrguer Artesanal', categoria: 'Lanches', preco: 32.00 },
            { produto: 'Cachorro-Quente', categoria: 'Lanches', preco: 18.00 },
            { produto: 'Batata Frita P', categoria: 'Porções', preco: 15.00 },
            { produto: 'Batata Frita G', categoria: 'Porções', preco: 25.00 },
            { produto: 'Anéis de Cebola', categoria: 'Porções', preco: 22.00 }
        ];
        
        let comandas = [];
        let tempOrder = [];
        let selectedProduct = null;
        let selectedCategory = null;
        let selectedComandaId = null;

        function renderCategories() {
            const cats = [...new Set(cardapio.map(p => p.categoria))].sort();
            const div = document.getElementById('categories');
            div.innerHTML = cats.map(c => '<button onclick="selectCat(this, ' + "'" + c + "'" + ')">' + c + '</button>').join('');
        }

        function selectCat(btn, cat) {
            selectedCategory = cat;
            document.querySelectorAll('#categories button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts();
        }

        function renderProducts() {
            let filtered = cardapio;
            if (selectedCategory) {
                filtered = cardapio.filter(p => p.categoria === selectedCategory);
            }
            const div = document.getElementById('products');
            div.innerHTML = filtered.map((p, idx) => '<button class="product-btn" onclick="selectProd(this, ' + "'" + p.produto + "'" + ', ' + p.preco + ')"><div class="product-name">' + p.produto + '</div><div class="product-price">R$ ' + p.preco.toFixed(2) + '</div></button>').join('');
        }

        function selectProd(btn, name, price) {
            document.querySelectorAll('.product-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedProduct = { name, price };
        }

        function addProduct() {
            const client = document.getElementById('clientName').value.trim();
            if (!client) { showMsg('❌ Digite o nome do cliente', 'error'); return; }
            if (!selectedProduct) { showMsg('❌ Selecione um produto', 'error'); return; }
            
            const qty = parseInt(document.getElementById('qty').value) || 1;
            tempOrder.push({ 
                name: selectedProduct.name, 
                price: selectedProduct.price, 
                qty, 
                sub: selectedProduct.price * qty 
            });
            showOrder();
            document.getElementById('qty').value = '1';
            showMsg('✅ Produto adicionado!', 'success');
        }

        function showOrder() {
            const div = document.getElementById('order');
            const items = document.getElementById('orderItems');
            
            let html = '';
            let total = 0;
            tempOrder.forEach((i, idx) => {
                total += i.sub;
                html += '<div class="order-item"><div><strong>' + i.name + '</strong> <span style="color: #999;">x' + i.qty + '</span></div><div style="color: #d4a574; font-weight: bold;">R$ ' + i.sub.toFixed(2) + '</div></div>';
            });
            
            items.innerHTML = html;
            document.getElementById('total').textContent = total.toFixed(2);
            div.classList.add('show');
        }

        function submitOrder() {
            const client = document.getElementById('clientName').value.trim();
            if (!client || tempOrder.length === 0) { showMsg('❌ Erro', 'error'); return; }
            
            let total = 0;
            tempOrder.forEach(i => total += i.sub);
            
            comandas.push({
                id: Date.now(),
                cliente: client,
                items: [...tempOrder],
                total: total,
                status: 'Aberto',
                data: new Date().toLocaleString('pt-BR')
            });
            
            saveComandas();
            showMsg('✅ Comanda enviada com sucesso!', 'success');
            tempOrder = [];
            document.getElementById('order').classList.remove('show');
            document.getElementById('clientName').value = '';
            document.querySelectorAll('.product-btn').forEach(b => b.classList.remove('active'));
        }

        function searchAndShowComanda() {
            const search = document.getElementById('searchClient').value.toLowerCase().trim();
            const div = document.getElementById('comandaDetail');
            
            if (!search) {
                div.innerHTML = '';
                renderResumo();
                return;
            }
            
            const clientComandas = comandas.filter(c => c.status === 'Aberto' && c.cliente.toLowerCase() === search);
            
            if (clientComandas.length === 0) {
                div.innerHTML = '<p style="text-align: center; color: #999; margin: 20px 0;">Nenhuma comanda aberta para este cliente</p>';
                renderResumo();
                return;
            }
            
            let totalGeral = 0;
            let htmlItens = '<table class="caixa-table"><thead><tr><th>Produto</th><th>Preço Unit</th><th>Qtd</th><th>Subtotal</th></tr></thead><tbody>';
            
            clientComandas.forEach(comanda => {
                comanda.items.forEach(item => {
                    htmlItens += '<tr><td>' + item.name + '</td><td>R$ ' + item.price.toFixed(2) + '</td><td>' + item.qty + '</td><td>R$ ' + item.sub.toFixed(2) + '</td></tr>';
                    totalGeral += item.sub;
                });
            });
            
            htmlItens += '</tbody></table>';
            
            let html = '<div class="info-box"><h3>ITENS DA COMANDA:</h3>' + htmlItens + '</div>';
            html += '<div class="info-box"><h3>TOTAL A PAGAR:</h3><div class="value">R$ ' + totalGeral.toFixed(2) + '</div>';
            html += '<button class="btn-pagar" onclick="markAsPaid(' + "'" + search + "'" + ')">✅ Marcar como PAGO</button></div>';
            
            div.innerHTML = html;
            renderResumo();
        }

        function markAsPaid(clientName) {
            comandas.forEach(c => {
                if (c.status === 'Aberto' && c.cliente.toLowerCase() === clientName.toLowerCase()) {
                    c.status = 'Pago';
                }
            });
            
            saveComandas();
            showMsg('✅ Comanda marcada como PAGO!', 'success');
            document.getElementById('searchClient').value = '';
            document.getElementById('comandaDetail').innerHTML = '';
            renderResumo();
        }

        function renderResumo() {
            const tbody = document.getElementById('resumoTable');
            const abertos = comandas.filter(c => c.status === 'Aberto');
            
            const resumo = {};
            abertos.forEach(c => {
                if (!resumo[c.cliente]) {
                    resumo[c.cliente] = 0;
                }
                resumo[c.cliente] += c.total;
            });
            
            if (Object.keys(resumo).length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" style="text-align: center; color: #999;">Nenhuma comanda aberta</td></tr>';
                return;
            }
            
            tbody.innerHTML = Object.entries(resumo).map(([cliente, total]) => `
                <tr>
                    <td>${cliente}</td>
                    <td>R$ ${total.toFixed(2)}</td>
                </tr>
            `).join('');
        }

        function renderAdminTable() {
            const tbody = document.getElementById('adminTable');
            tbody.innerHTML = cardapio.map((p, idx) => `
                <tr>
                    <td><input type="text" value="${p.produto}" onchange="updateProduct(${idx}, 'produto', this.value)"></td>
                    <td><input type="text" value="${p.categoria}" onchange="updateProduct(${idx}, 'categoria', this.value)"></td>
                    <td><input type="number" step="0.01" value="${p.preco}" onchange="updateProduct(${idx}, 'preco', parseFloat(this.value))"></td>
                    <td><button class="btn-remove" onclick="removeProduct(${idx})">❌ Remover</button></td>
                </tr>
            `).join('');
        }

        function updateProduct(idx, field, value) {
            cardapio[idx][field] = value;
            saveToLocalStorage();
            renderCategories();
            renderProducts();
        }

        function removeProduct(idx) {
            cardapio.splice(idx, 1);
            saveToLocalStorage();
            renderAdminTable();
            renderCategories();
            renderProducts();
        }

        function addNewProduct() {
            cardapio.push({ produto: 'Novo Produto', categoria: 'Bebidas', preco: 0.00 });
            saveToLocalStorage();
            renderAdminTable();
        }

        function saveComandas() {
            localStorage.setItem('comandas', JSON.stringify(comandas));
        }

        function loadComandas() {
            const saved = localStorage.getItem('comandas');
            if (saved) {
                comandas = JSON.parse(saved);
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('cardapio', JSON.stringify(cardapio));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('cardapio');
            if (saved) {
                cardapio = JSON.parse(saved);
            }
        }

        function showMsg(msg, type) {
            const div = document.getElementById('msg');
            div.className = 'msg show ' + type;
            div.textContent = msg;
            setTimeout(() => { div.classList.remove('show'); }, 3000);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.header-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
            
            if (tab === 'admin') {
                renderAdminTable();
            } else if (tab === 'caixa') {
                renderResumo();
            }
        }

        // Inicializar
        loadFromLocalStorage();
        loadComandas();
        renderCategories();
        renderProducts();
        renderResumo();
    </script>
</body>
</html>
