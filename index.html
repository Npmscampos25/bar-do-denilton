<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar do Denilton</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .header { background: #d4a574; color: white; padding: 15px; text-align: center; }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }
        .section { background: white; padding: 20px; margin: 10px; border-radius: 10px; }
        input, button { padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        input { width: 100%; }
        button { cursor: pointer; background: #d4a574; color: white; border: none; width: 100%; }
        button:hover { background: #8b6f47; }
        .category-btn, .product-btn { width: 100%; margin: 5px 0; padding: 10px; }
        .category-btn.active { background: #d4a574; color: white; }
        .order-item { padding: 10px; border-bottom: 1px solid #ddd; }
        .order-total { font-weight: bold; font-size: 18px; padding: 10px; }
        .command-item { padding: 10px; background: #f9f9f9; margin: 5px 0; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🍺 Bar do Denilton</h1>
        <button onclick="switchTab('garcom')">Garçom</button>
        <button onclick="switchTab('caixa')">Caixa</button>
        <button onclick="loadData()">Sincronizar</button>
    </div>

    <div id="garcom" class="tab-content active">
        <div class="section">
            <input type="text" id="clientName" placeholder="Nome do cliente">
            <div id="categories"></div>
            <div id="products"></div>
            <input type="number" id="qty" value="1" min="1">
            <button onclick="addProduct()">Adicionar</button>
            <div id="order"></div>
        </div>
    </div>

    <div id="caixa" class="tab-content">
        <div class="section">
            <input type="text" id="searchClient" placeholder="Buscar cliente" onkeyup="searchCommands()">
            <div id="commands"></div>
            <div id="detail"></div>
        </div>
    </div>

    <script>
        const CARDAPIO_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRvRo_-zdckXUkZYN4-UnEFF9i1074qbRwjFdYM0q2ussAwqtF_FvTBeFswrWR-SfeDgpPA06UrYTwH/pub?gid=1205665778&single=true&output=csv';
        
        let cardapio = [];
        let tempOrder = [];
        let selectedProduct = null;
        let selectedCategory = null;

        function parseCSV(text) {
            const lines = text.split('\n');
            return lines.map(line => line.split(','));
        }

        async function loadData() {
            try {
                const res = await fetch(CARDAPIO_URL);
                const text = await res.text();
                cardapio = parseCSV(text).slice(1).filter(r => r[0] && r[0].trim());
                console.log('Cardápio:', cardapio);
                renderCategories();
                renderProducts();
                alert('Sincronizado!');
            } catch(e) {
                alert('Erro: ' + e.message);
            }
        }

        function renderCategories() {
            const cats = [...new Set(cardapio.map(p => p[1]))];
            const div = document.getElementById('categories');
            div.innerHTML = cats.map(c => '<button class="category-btn" onclick="selectCat(this)">' + c + '</button>').join('');
        }

        function selectCat(btn) {
            selectedCategory = btn.textContent;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts();
        }

        function renderProducts() {
            let filtered = cardapio;
            if (selectedCategory) {
                filtered = cardapio.filter(p => p[1] === selectedCategory);
            }
            const div = document.getElementById('products');
            div.innerHTML = filtered.map(p => {
                const price = parseFloat(p[2].replace('R$', '').replace(',', '.')) || 0;
                return '<button class="product-btn" onclick="selectProd(' + price + ', ' + "'" + p[0] + "'" + ')">' + p[0] + ' - R$ ' + price.toFixed(2) + '</button>';
            }).join('');
        }

        function selectProd(price, name) {
            selectedProduct = { price, name };
        }

        function addProduct() {
            const client = document.getElementById('clientName').value;
            if (!client || !selectedProduct) return alert('Selecione cliente e produto');
            
            const qty = parseInt(document.getElementById('qty').value);
            tempOrder.push({ name: selectedProduct.name, price: selectedProduct.price, qty, sub: selectedProduct.price * qty });
            showOrder();
        }

        function showOrder() {
            const div = document.getElementById('order');
            let html = '<div class="order-item"><strong>Comanda</strong></div>';
            let total = 0;
            tempOrder.forEach(i => {
                total += i.sub;
                html += '<div class="order-item">' + i.name + ' x' + i.qty + ' = R$ ' + i.sub.toFixed(2) + '</div>';
            });
            html += '<div class="order-total">Total: R$ ' + total.toFixed(2) + '</div>';
            html += '<button onclick="submitOrder()">Finalizar</button>';
            div.innerHTML = html;
        }

        function submitOrder() {
            alert('Comanda enviada!');
            tempOrder = [];
            document.getElementById('order').innerHTML = '';
            document.getElementById('clientName').value = '';
        }

        function searchCommands() {
            const div = document.getElementById('commands');
            div.innerHTML = '<p>Sem comandas abertas</p>';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
        }

        loadData();
    </script>
</body>
</html>
