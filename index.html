<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar do Denilton</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; }
        body { 
            font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #333;
        }
        
        .header { 
            background: linear-gradient(135deg, #d4a574 0%, #8b6f47 100%);
            color: #1a1a1a;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(212, 165, 116, 0.4);
        }
        
        .header-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .header-emoji { font-size: 48px; }
        
        .header h1 { 
            font-size: 32px;
            margin-bottom: 15px;
            letter-spacing: 1px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header-buttons { 
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .header-btn { 
            background: rgba(255,255,255,0.3);
            border: 3px solid white;
            color: white;
            padding: 12px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        
        .header-btn:hover { 
            background: white;
            color: #8b6f47;
            transform: scale(1.05);
        }
        
        .header-btn.active { 
            background: white;
            color: #8b6f47;
            font-weight: 900;
        }
        
        .tab-content { 
            display: none;
            padding: 20px;
            min-height: calc(100vh - 220px);
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
        }
        
        .tab-content.active { 
            display: block;
        }
        
        .section { 
            background: white;
            padding: 25px;
            margin: 15px auto;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            max-width: 1000px;
            border: 3px solid #d4a574;
            position: relative;
        }
        
        .section::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 20px;
            width: 20px;
            height: 20px;
            background: #d4a574;
            border-radius: 50%;
            box-shadow: 40px 0 0 #d4a574, 80px 0 0 #d4a574;
        }
        
        .section h2 {
            color: #8b6f47;
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: 900;
        }
        
        input, button, select { 
            padding: 12px;
            margin: 5px 0;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Segoe UI', sans-serif;
            transition: all 0.3s;
        }
        
        input { width: 100%; }
        input:focus, button:focus, select:focus { 
            outline: none;
            border-color: #d4a574;
            box-shadow: 0 0 10px rgba(212, 165, 116, 0.5);
            transform: scale(1.02);
        }
        
        button { 
            cursor: pointer;
            background: linear-gradient(135deg, #d4a574 0%, #8b6f47 100%);
            color: white;
            border: none;
            width: 100%;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        button:hover { 
            background: linear-gradient(135deg, #8b6f47 0%, #6b5635 100%);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }
        
        button:active { transform: translateY(-1px); }
        
        .categories { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
            margin: 15px 0;
        }
        
        .categories button { 
            padding: 12px;
            border: 3px dashed #d4a574;
            background: white;
            color: #8b6f47;
            font-weight: bold;
            border-radius: 15px;
            margin: 0;
            width: 100%;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .categories button:hover { 
            border-style: solid;
            background: #f9f5f0;
            transform: rotate(2deg);
        }
        
        .categories button.active { 
            background: #d4a574;
            color: white;
            border-style: solid;
            transform: rotate(0deg) scale(1.05);
        }
        
        .products-grid { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }
        
        .product-btn { 
            padding: 15px 10px;
            border: 3px solid #d4a574;
            background: white;
            color: #333;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .product-btn:hover { 
            border-color: #8b6f47;
            background: #f9f5f0;
            transform: translateY(-5px) rotate(-1deg);
            box-shadow: 0 8px 15px rgba(212, 165, 116, 0.3);
        }
        
        .product-btn.active { 
            background: #d4a574;
            color: white;
            border-color: #8b6f47;
            transform: rotate(0deg) scale(1.08);
            box-shadow: 0 6px 20px rgba(212, 165, 116, 0.4);
        }
        
        .product-name { font-size: 14px; font-weight: bold; }
        .product-price { color: #d4a574; font-weight: bold; font-size: 18px; }
        .product-btn.active .product-price { color: white; }
        
        .qty-section { 
            display: flex;
            gap: 10px;
            margin-top: 20px;
            align-items: center;
        }
        
        .qty-input { 
            flex: 0 0 80px;
            margin: 0;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
        
        .qty-section button { flex: 1; margin: 0; }
        
        .order { 
            background: linear-gradient(135deg, #fff9f5 0%, #fff5ed 100%);
            border: 4px dashed #d4a574;
            border-radius: 20px;
            padding: 25px;
            margin-top: 25px;
            display: none;
            box-shadow: 0 8px 20px rgba(212, 165, 116, 0.3);
            position: relative;
        }
        
        .order::before {
            content: '🍽️';
            position: absolute;
            top: -20px;
            left: 30px;
            font-size: 40px;
        }
        
        .order.show { 
            display: block;
            animation: slideIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        @keyframes slideIn { 
            from { 
                opacity: 0;
                transform: translateY(30px) rotateX(90deg);
            }
            to { 
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }
        
        .order h3 { 
            color: #8b6f47;
            margin: 20px 0 15px 0;
            font-size: 22px;
            font-weight: 900;
        }
        
        .order-item { 
            padding: 12px;
            border-bottom: 2px dotted #d4a574;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        
        .order-item:last-child { 
            border-bottom: none;
        }
        
        .order-total { 
            font-weight: 900;
            font-size: 24px;
            padding: 20px;
            border-top: 3px dashed #d4a574;
            color: #d4a574;
            text-align: right;
            margin-top: 15px;
            background: white;
            border-radius: 10px;
        }
        
        .btn-submit { 
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%) !important;
            width: 100%;
            margin-top: 15px !important;
            font-size: 18px !important;
        }
        
        .btn-submit:hover { 
            background: linear-gradient(135deg, #229954 0%, #1e8449 100%) !important;
        }
        
        .msg { 
            padding: 15px;
            margin: 15px 0;
            border-radius: 12px;
            display: none;
            animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            font-weight: bold;
            font-size: 15px;
        }
        
        .msg.show { display: block; }
        .msg.success { 
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            border: 2px solid #27ae60;
        }
        .msg.error { 
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
            border: 2px solid #ff6b6b;
        }
        
        @keyframes popIn { 
            0% { opacity: 0; transform: scale(0.8); }
            50% { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        .admin-table, .caixa-table, .resumo-table { 
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .admin-table th, .caixa-table th, .resumo-table th { 
            background: linear-gradient(135deg, #d4a574 0%, #8b6f47 100%);
            color: white;
            font-weight: bold;
            padding: 12px;
            text-align: left;
            font-size: 15px;
        }
        
        .admin-table td, .caixa-table td, .resumo-table td { 
            border: 2px solid #d4a574;
            padding: 12px;
        }
        
        .admin-table input { width: 100%; margin: 0; }
        .admin-table tr:nth-child(even) { background: #f9f5f0; }
        .admin-table tr:hover { background: #fff5ed; }
        
        .btn-add { 
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%) !important;
            margin-top: 15px;
            font-size: 16px;
        }
        
        .btn-remove { 
            background: linear-gradient(135deg, #ff6b6b 0%, #e74c3c 100%) !important;
            width: 100%;
            margin: 0;
            padding: 8px;
            font-size: 13px;
        }
        
        .search-section { 
            background: linear-gradient(135deg, #fff9f5 0%, #f9f5f0 100%);
            border: 3px dashed #d4a574;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .search-section label { 
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #8b6f47;
            font-size: 16px;
        }
        
        .info-box { 
            background: linear-gradient(135deg, #f0f7ff 0%, #e3f2fd 100%);
            border-left: 5px solid #d4a574;
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(212, 165, 116, 0.2);
        }
        
        .info-box h3 { 
            color: #8b6f47;
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: 900;
        }
        
        .info-box .value { 
            font-size: 32px;
            font-weight: 900;
            color: #d4a574;
        }
        
        .senha-container { 
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            border: 4px solid #d4a574;
        }
        
        .senha-container h2 { 
            color: #8b6f47;
            margin-bottom: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: 900;
        }
        
        .senha-container input { 
            margin-bottom: 20px;
            border: 2px solid #d4a574;
        }
        .senha-container button { margin-bottom: 10px; }
        .senha-error { 
            color: #ff6b6b;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }
        
        label { color: #8b6f47; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-logo">
            <div class="header-emoji">🍺</div>
        </div>
        <h1>🍺 BAR DO DENILTON 🍺</h1>
        <div class="header-buttons">
            <button class="header-btn active" onclick="switchTab('garcom')">🍽️ Garçom</button>
            <button class="header-btn" onclick="switchTab('caixa')">💰 Caixa</button>
            <button class="header-btn" id="adminBtn" onclick="tryOpenAdmin()">⚙️ Admin</button>
        </div>
    </div>

    <div id="senhaModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; display: flex; align-items: center; justify-content: center;">
        <div class="senha-container">
            <h2>🔐 Acesso Admin</h2>
            <input type="password" id="senhaInput" placeholder="Digite a senha" onkeypress="if(event.key==='Enter') validarSenha()">
            <button onclick="validarSenha()">Entrar 🚪</button>
            <button onclick="fecharSenha()" style="background: linear-gradient(135deg, #999 0%, #777 100%);">Cancelar</button>
            <div class="senha-error" id="senhaError"></div>
        </div>
    </div>

    <div id="garcom" class="tab-content active">
        <div class="section">
            <h2>🍽️ Novo Pedido</h2>
            <div id="msg" class="msg"></div>
            
            <div>
                <label style="display: block; margin-bottom: 8px;">👤 Quem tá pedindo?</label>
                <input type="text" id="clientName" placeholder="Nome do cliente">
            </div>
            
            <div>
                <label style="display: block; margin: 15px 0 8px 0;">📂 O que quer?</label>
                <div class="categories" id="categories"></div>
            </div>
            
            <div>
                <label style="display: block; margin: 15px 0 8px 0;">🍔 Escolhe aí!</label>
                <div class="products-grid" id="products"></div>
            </div>
            
            <div class="qty-section">
                <label style="flex: 0 0 80px;">Qtd</label>
                <input type="number" id="qty" value="1" min="1" class="qty-input">
                <button onclick="addProduct()">➕ Bora!</button>
            </div>
            
            <div class="order" id="order">
                <h3>📋 Sua Comanda</h3>
                <div id="orderItems"></div>
                <div class="order-total">Total: R$ <span id="total">0.00</span></div>
                <button class="btn-submit" onclick="submitOrder()">✅ Fecha a Comanda!</button>
            </div>
        </div>
    </div>

    <div id="caixa" class="tab-content">
        <div class="section">
            <h2>💰 Caixa</h2>
            
            <div class="search-section">
                <label>🔍 Procura aí:</label>
                <input type="text" id="searchClient" placeholder="Nome do cliente" onkeyup="searchAndShowComanda()">
            </div>
            
            <div id="comandaDetail"></div>
            
            <h3 style="margin-top: 30px; color: #8b6f47; font-size: 20px; font-weight: 900;">📊 Quem tá devendo agora:</h3>
            <table class="resumo-table">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="resumoTable"></tbody>
            </table>
        </div>
    </div>

    <div id="admin" class="tab-content">
        <div class="section">
            <h2>⚙️ Mexer no Cardápio</h2>
            <p style="margin: 10px 0; color: #666; font-size: 15px;">Adiciona, edita ou tira os produtos:</p>
            
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="adminTable"></tbody>
            </table>
            
            <button class="btn-add" onclick="addNewProduct()">➕ Novo Produto</button>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'admin123';
        let adminUnlocked = false;

        let cardapio = [
            { produto: 'Cerveja Brahma', categoria: 'Bebidas', preco: 9.00 },
            { produto: 'Coca-Cola', categoria: 'Bebidas', preco: 6.00 },
            { produto: 'X-Salada', categoria: 'Lanches', preco: 27.00 },
            { produto: 'X-Bacon', categoria: 'Lanches', preco: 32.00 },
            { produto: 'Porção Frita', categoria: 'Porções', preco: 45.00 },
            { produto: 'Cerveja Heineken', categoria: 'Bebidas', preco: 12.00 },
            { produto: 'Cerveja Itaipava', categoria: 'Bebidas', preco: 8.00 },
            { produto: 'X-Tudo', categoria: 'Lanches', preco: 35.00 },
            { produto: 'X-Frango', categoria: 'Lanches', preco: 25.00 },
            { produto: 'X-Calabresa', categoria: 'Lanches', preco: 28.00 },
            { produto: 'Hambúrguer Artesanal', categoria: 'Lanches', preco: 32.00 },
            { produto: 'Cachorro-Quente', categoria: 'Lanches', preco: 18.00 },
            { produto: 'Batata Frita P', categoria: 'Porções', preco: 15.00 },
            { produto: 'Batata Frita G', categoria: 'Porções', preco: 25.00 },
            { produto: 'Anéis de Cebola', categoria: 'Porções', preco: 22.00 }
        ];
        
        let comandas = [];
        let tempOrder = [];
        let selectedProduct = null;
        let selectedCategory = null;

        function tryOpenAdmin() {
            if (!adminUnlocked) {
                document.getElementById('senhaModal').style.display = 'flex';
                document.getElementById('senhaInput').focus();
            } else {
                switchTab('admin');
            }
        }

        function validarSenha() {
            const senha = document.getElementById('senhaInput').value;
            if (senha === ADMIN_PASSWORD) {
                adminUnlocked = true;
                fecharSenha();
                switchTab('admin');
            } else {
                document.getElementById('senhaError').textContent = '❌ Errado! Tenta de novo';
                document.getElementById('senhaInput').value = '';
            }
        }

        function fecharSenha() {
            document.getElementById('senhaModal').style.display = 'none';
            document.getElementById('senhaInput').value = '';
            document.getElementById('senhaError').textContent = '';
        }

        function renderCategories() {
            const cats = [...new Set(cardapio.map(p => p.categoria))].sort();
            const div = document.getElementById('categories');
            div.innerHTML = cats.map(c => '<button onclick="selectCat(this, ' + "'" + c + "'" + ')">' + c + '</button>').join('');
        }

        function selectCat(btn, cat) {
            selectedCategory = cat;
            document.querySelectorAll('#categories button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts();
        }

        function renderProducts() {
            let filtered = cardapio;
            if (selectedCategory) {
                filtered = cardapio.filter(p => p.categoria === selectedCategory);
            }
            const div = document.getElementById('products');
            div.innerHTML = filtered.map((p, idx) => '<button class="product-btn" onclick="selectProd(this, ' + "'" + p.produto + "'" + ', ' + p.preco + ')"><div class="product-name">' + p.produto + '</div><div class="product-price">R$ ' + p.preco.toFixed(2) + '</div></button>').join('');
        }

        function selectProd(btn, name, price) {
            document.querySelectorAll('.product-btn').forEach(b => b.classList.remove('active'));
